services:
  mailflare:
    build: .
    image: mailflare:local
    restart: unless-stopped
    ports:
      - "3000:3000"   # web app and JMAP
      - "2525:2525"   # inbound SMTP (local; use 25:25 in production)
    env_file: .env.docker
    volumes:
      - mailflare-data:/data

volumes:
  mailflare-data:
